<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员登录 · 我的小站</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 56px 48px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(80,60,30,0.08);
    }
    .login-card h1 {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      font-weight: 400;
      color: var(--text);
      margin-bottom: 8px;
    }
    .login-card p {
      font-size: .85rem;
      color: var(--text-muted);
      margin-bottom: 40px;
    }
    .form-group { margin-bottom: 24px; }
    .form-group label {
      display: block;
      font-size: .75rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--accent-lt);
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 2px;
      font-family: var(--font-body);
      font-size: .95rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .form-group input:focus { border-color: var(--accent); }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 2px;
      font-family: var(--font-body);
      font-size: .88rem;
      letter-spacing: .1em;
      cursor: pointer;
      transition: opacity .2s;
      margin-top: 8px;
    }
    .login-btn:hover { opacity: .85; }
    .login-error {
      color: #b94040;
      font-size: .82rem;
      margin-top: 16px;
      text-align: center;
      display: none;
    }
    .login-error.show { display: block; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 28px;
      font-size: .8rem;
      color: var(--text-muted);
      letter-spacing: .08em;
    }
    .back-link:hover { color: var(--text); }
    /* 设置区 */
    .settings-section {
      display: none;
      margin-top: 32px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
    }
    .settings-section.show { display: block; }
    .settings-section h2 {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--text);
      margin-bottom: 20px;
    }
    .save-btn {
      width: 100%;
      padding: 12px;
      background: var(--bg-warm);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 2px;
      font-family: var(--font-body);
      font-size: .85rem;
      cursor: pointer;
      transition: background .2s;
      margin-top: 8px;
    }
    .save-btn:hover { background: var(--border); }
    .success-msg {
      color: #3a7a3a;
      font-size: .82rem;
      margin-top: 12px;
      text-align: center;
      display: none;
    }
    .success-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="login-card">
    <!-- 登录表单 -->
    <div id="login-form">
      <h1>管理员登录</h1>
      <p>请输入账号和密码以进入编辑模式</p>
      <div class="form-group">
        <label>账号</label>
        <input type="text" id="username" placeholder="输入账号" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="输入密码" autocomplete="current-password" />
      </div>
      <button class="login-btn" onclick="doLogin()">登 录</button>
      <p class="login-error" id="login-error">账号或密码错误，请重试</p>
      <a class="back-link" href="index.html">← 返回首页</a>
    </div>

    <!-- 登录成功后显示 -->
    <div id="logged-panel" style="display:none">
      <h1>欢迎回来 👋</h1>
      <p>已进入编辑模式，请前往各页面进行编辑。</p>
      <a class="login-btn" style="display:block;text-align:center;text-decoration:none;margin-bottom:12px" href="index.html">前往首页编辑</a>
      <a class="login-btn" style="display:block;text-align:center;text-decoration:none;background:var(--bg-warm);color:var(--text);border:1px solid var(--border);margin-bottom:12px" href="gallery.html">前往相册编辑</a>
      <a class="login-btn" style="display:block;text-align:center;text-decoration:none;background:var(--bg-warm);color:var(--text);border:1px solid var(--border);margin-bottom:12px" href="writings.html">前往随笔编辑</a>
      <a class="login-btn" style="display:block;text-align:center;text-decoration:none;background:var(--bg-warm);color:var(--text);border:1px solid var(--border)" href="about.html">前往关于页编辑</a>

      <!-- 修改账号密码 -->
      <div class="settings-section show">
        <h2>修改登录信息</h2>
        <div class="form-group">
          <label>新账号</label>
          <input type="text" id="new-username" placeholder="留空则不修改" />
        </div>
        <div class="form-group">
          <label>新密码</label>
          <input type="password" id="new-password" placeholder="留空则不修改" />
        </div>
        <div class="form-group">
          <label>确认新密码</label>
          <input type="password" id="confirm-password" placeholder="再次输入新密码" />
        </div>
        <button class="save-btn" onclick="saveCredentials()">保存修改</button>
        <p class="success-msg" id="save-success">已保存！下次登录请使用新账号密码。</p>
      </div>

      <button class="save-btn" style="margin-top:24px" onclick="doLogout()">退出登录</button>
    </div>
  </div>

  <script>
    // 默认账号密码（首次使用）
    var DEFAULT_USER = 'admin';
    var DEFAULT_PASS = '123456';

    function getCredentials() {
      return {
        user: localStorage.getItem('site_admin_user') || DEFAULT_USER,
        pass: localStorage.getItem('site_admin_pass') || DEFAULT_PASS
      };
    }

    function isLoggedIn() {
      return sessionStorage.getItem('site_logged_in') === '1';
    }

    // 页面加载时检查是否已登录
    window.addEventListener('DOMContentLoaded', function() {
      if (isLoggedIn()) {
        showLoggedPanel();
      }
    });

    function doLogin() {
      var u = document.getElementById('username').value.trim();
      var p = document.getElementById('password').value;
      var creds = getCredentials();
      if (u === creds.user && p === creds.pass) {
        sessionStorage.setItem('site_logged_in', '1');
        document.getElementById('login-error').classList.remove('show');
        showLoggedPanel();
      } else {
        document.getElementById('login-error').classList.add('show');
      }
    }

    function showLoggedPanel() {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('logged-panel').style.display = 'block';
    }

    function doLogout() {
      sessionStorage.removeItem('site_logged_in');
      location.reload();
    }

    function saveCredentials() {
      var nu = document.getElementById('new-username').value.trim();
      var np = document.getElementById('new-password').value;
      var cp = document.getElementById('confirm-password').value;
      if (np && np !== cp) { alert('两次密码不一致！'); return; }
      if (nu) localStorage.setItem('site_admin_user', nu);
      if (np) localStorage.setItem('site_admin_pass', np);
      document.getElementById('save-success').classList.add('show');
      setTimeout(function(){ document.getElementById('save-success').classList.remove('show'); }, 3000);
    }

    // 回车触发登录
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !isLoggedIn()) doLogin();
    });
  </script>
</body>
</html>
