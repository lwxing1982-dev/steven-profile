<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理中心 · 我的小站</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
    .admin-wrap { width:100%; max-width:460px; }
    .card { background:var(--bg-card); border:1px solid var(--border); border-radius:4px; padding:48px 40px; box-shadow:0 8px 40px rgba(80,60,30,.08); }
    .card-title { font-family:var(--font-serif); font-size:1.9rem; font-weight:400; color:var(--text); margin-bottom:6px; }
    .card-sub { font-size:.85rem; color:var(--text-muted); margin-bottom:36px; }
    .field { margin-bottom:20px; }
    .field label { display:block; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent-lt); margin-bottom:7px; }
    .field input { width:100%; padding:11px 14px; background:var(--bg); border:1px solid var(--border); border-radius:2px; font-family:var(--font-body); font-size:.93rem; color:var(--text); outline:none; transition:border-color .2s; }
    .field input:focus { border-color:var(--accent); }
    .btn-primary { width:100%; padding:13px; margin-top:4px; background:var(--text); color:var(--bg); border:none; border-radius:2px; font-family:var(--font-body); font-size:.88rem; letter-spacing:.08em; cursor:pointer; transition:opacity .2s; }
    .btn-primary:hover { opacity:.85; }
    .btn-secondary { width:100%; padding:11px; margin-top:10px; background:var(--bg-warm); color:var(--text); border:1px solid var(--border); border-radius:2px; font-family:var(--font-body); font-size:.85rem; cursor:pointer; transition:background .2s; display:block; text-align:center; text-decoration:none; }
    .btn-secondary:hover { background:rgba(150,130,100,0.2); }
    .err { color:#a04040; font-size:.82rem; margin-top:12px; text-align:center; display:none; }
    .err.show { display:block; }
    .ok { color:#3a7a3a; font-size:.82rem; margin-top:12px; text-align:center; display:none; }
    .ok.show { display:block; }
    .divider { border:none; border-top:1px solid var(--border); margin:32px 0; }
    .nav-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px; }
    .tab-btns { display:flex; border-bottom:1px solid var(--border); margin-bottom:28px; }
    .tab-btn { flex:1; padding:10px; background:none; border:none; font-family:var(--font-body); font-size:.83rem; letter-spacing:.08em; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:all .2s; }
    .tab-btn.active { color:var(--text); border-bottom-color:var(--text); }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }
    .hint { font-size:.75rem; color:var(--text-muted); margin-top:8px; line-height:1.7; }
    .badge { display:inline-block; background:rgba(80,160,80,.15); border:1px solid rgba(80,160,80,.3); border-radius:10px; padding:2px 10px; font-size:.7rem; color:#3a7a3a; margin-left:8px; vertical-align:middle; }
    #logged-panel { display:none; }
  </style>
</head>
<body>
<div class="admin-wrap">
  <div id="login-panel" class="card">
    <h1 class="card-title">管理员登录</h1>
    <p class="card-sub">输入账号和密码进入编辑模式</p>
    <div class="field"><label>账号</label><input type="text" id="iu" placeholder="账号" autocomplete="username"/></div>
    <div class="field"><label>密码</label><input type="password" id="ip" placeholder="密码" autocomplete="current-password"/></div>
    <button class="btn-primary" onclick="doLogin()">登 录</button>
    <p class="err" id="login-err">账号或密码错误，请重试</p>
    <a class="btn-secondary" href="index.html" style="margin-top:20px">← 返回首页</a>
  </div>
  <div id="logged-panel" class="card">
    <h1 class="card-title">管理中心 <span class="badge">✓ 已登录</span></h1>
    <p class="card-sub">选择页面编辑内容，或管理账号 / API 设置</p>
    <div class="nav-grid">
      <a class="btn-secondary" href="index.html">🏠 首页</a>
      <a class="btn-secondary" href="gallery.html">📷 相册</a>
      <a class="btn-secondary" href="writings.html">✍️ 随笔</a>
      <a class="btn-secondary" href="about.html">👤 关于我</a>
    </div>
    <hr class="divider"/>
    <div class="tab-btns">
      <button class="tab-btn active" onclick="switchTab('account',this)">修改账号密码</button>
      <button class="tab-btn" onclick="switchTab('unsplash',this)">Unsplash API Key</button>
    </div>
    <div id="tab-account" class="tab-panel active">
      <div class="field"><label>新账号（留空不修改）</label><input type="text" id="nu" placeholder="留空保持原账号"/></div>
      <div class="field"><label>新密码（留空不修改）</label><input type="password" id="np" placeholder="留空保持原密码"/></div>
      <div class="field"><label>确认新密码</label><input type="password" id="cp" placeholder="再次输入"/></div>
      <button class="btn-primary" onclick="saveAccount()">保存</button>
      <p class="ok" id="acct-ok">✓ 已保存！</p>
      <p class="err" id="acct-err">两次密码不一致</p>
    </div>
    <div id="tab-unsplash" class="tab-panel">
      <div class="field">
        <label>Unsplash Access Key</label>
        <input type="text" id="ukey" placeholder="粘贴你的 Access Key"/>
        <p class="hint">前往 <a href="https://unsplash.com/developers" target="_blank" style="color:var(--accent)">unsplash.com/developers</a> 注册并创建应用获取免费 Key（每小时 50 次请求）。留空时使用随机图片模式。</p>
      </div>
      <button class="btn-primary" onclick="saveUnsplash()">保存 API Key</button>
      <p class="ok" id="ukey-ok">✓ 已保存！</p>
    </div>
    <hr class="divider"/>
    <button class="btn-secondary" onclick="doLogout()" style="color:#a04040;border-color:rgba(160,64,64,.3)">退出登录</button>
  </div>
</div>
<script>
var D_U='admin', D_P='123456';
function creds(){return{u:localStorage.getItem('su')||D_U,p:localStorage.getItem('sp')||D_P};}
function isIn(){return sessionStorage.getItem('sok')==='1';}
window.addEventListener('DOMContentLoaded',function(){
  if(isIn()) showLogged();
  var k=localStorage.getItem('ukey');
  if(k) document.getElementById('ukey').value=k;
});
function doLogin(){
  var u=document.getElementById('iu').value.trim();
  var p=document.getElementById('ip').value;
  var c=creds();
  if(u===c.u&&p===c.p){sessionStorage.setItem('sok','1');document.getElementById('login-err').classList.remove('show');showLogged();}
  else document.getElementById('login-err').classList.add('show');
}
function showLogged(){document.getElementById('login-panel').style.display='none';document.getElementById('logged-panel').style.display='block';}
function doLogout(){sessionStorage.removeItem('sok');location.reload();}
function switchTab(id,btn){
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('tab-'+id).classList.add('active');btn.classList.add('active');
}
function saveAccount(){
  var nu=document.getElementById('nu').value.trim();
  var np=document.getElementById('np').value;
  var cp=document.getElementById('cp').value;
  document.getElementById('acct-err').classList.remove('show');document.getElementById('acct-ok').classList.remove('show');
  if(np&&np!==cp){document.getElementById('acct-err').classList.add('show');return;}
  if(nu)localStorage.setItem('su',nu);
  if(np)localStorage.setItem('sp',np);
  document.getElementById('acct-ok').classList.add('show');
  setTimeout(function(){document.getElementById('acct-ok').classList.remove('show');},3000);
}
function saveUnsplash(){
  var k=document.getElementById('ukey').value.trim();
  if(k)localStorage.setItem('ukey',k);else localStorage.removeItem('ukey');
  document.getElementById('ukey-ok').classList.add('show');
  setTimeout(function(){document.getElementById('ukey-ok').classList.remove('show');},3000);
}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&!isIn())doLogin();});
</script>
</body>
</html>
