<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的小站</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* 首页专属：隐藏导航，使用封面全屏 */
    body.home nav { background: transparent; border-bottom: none; }
    body.home nav .nav-logo { color: var(--text); }
    body.home nav .nav-links a { color: var(--text-muted); }
    body.home .page-content { padding-top: 0; }

    /* 首页引语区 */
    .home-quote {
      background: var(--bg-warm);
      padding: 100px 52px;
      text-align: center;
    }

    .home-quote blockquote {
      font-family: var(--font-serif);
      font-size: clamp(1.3rem, 3vw, 2rem);
      font-weight: 400;
      font-style: italic;
      color: var(--text);
      max-width: 640px;
      margin: 0 auto;
      line-height: 1.7;
    }

    .home-quote cite {
      display: block;
      margin-top: 24px;
      font-family: var(--font-body);
      font-style: normal;
      font-size: .82rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--accent-lt);
    }

    /* 首页三栏导航卡片 */
    .home-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .home-card {
      padding: 64px 48px;
      border-right: 1px solid var(--border);
      transition: background .3s;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .home-card:last-child { border-right: none; }
    .home-card:hover { background: var(--bg-warm); opacity: 1; }

    .home-card-num {
      font-family: var(--font-mono);
      font-size: .72rem;
      color: var(--accent-lt);
      letter-spacing: .15em;
    }

    .home-card-title {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 400;
      color: var(--text);
      line-height: 1.3;
    }

    .home-card-desc {
      font-size: .88rem;
      color: var(--text-muted);
      line-height: 1.8;
      margin-top: 4px;
    }

    .home-card-arrow {
      margin-top: auto;
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    @media (max-width: 768px) {
      .home-cards { grid-template-columns: 1fr; }
      .home-card { border-right: none; border-bottom: 1px solid var(--border); }
      .home-card:last-child { border-bottom: none; }
      .home-quote { padding: 72px 28px; }
    }
  </style>
</head>
<body class="home">

  <!-- 导航 -->
  <nav>
    <span class="nav-logo">我的小站</span>
    <ul class="nav-links">
      <li><a href="gallery.html">相册</a></li>
      <li><a href="writings.html">随笔</a></li>
      <li><a href="about.html">关于</a></li>
    </ul>
  </nav>

  <div class="page-content">

    <!-- 封面英雄区 -->
    <section class="hero">
      <p class="hero-eyebrow">个人小站</p>
      <h1 class="hero-title">记录<em>生活</em><br>的痕迹</h1>
      <div class="hero-divider"></div>
      <p class="hero-subtitle">
        这里存放着一些照片与文字，<br>
        都是普通日子里值得留下的片段。
      </p>
      <div class="hero-nav">
        <a href="gallery.html">相册</a>
        <a href="writings.html">随笔</a>
        <a href="about.html">关于我</a>
      </div>
      <div class="hero-scroll">滚动</div>
    </section>

    <!-- 引语 -->
    <div class="home-quote fade-in">
      <blockquote>
        "生活的每一个瞬间，都值得被温柔以待。"
        <cite>— 题记</cite>
      </blockquote>
    </div>

    <!-- 三栏导航卡片 -->
    <div class="home-cards">
      <a class="home-card fade-in" href="gallery.html">
        <span class="home-card-num">01</span>
        <h2 class="home-card-title">相册</h2>
        <p class="home-card-desc">用镜头留下那些一眼就想记住的光和影。</p>
        <span class="home-card-arrow">浏览图集 →</span>
      </a>
      <a class="home-card fade-in" href="writings.html" style="transition-delay:.1s">
        <span class="home-card-num">02</span>
        <h2 class="home-card-title">随笔</h2>
        <p class="home-card-desc">零散的感受与思考，写给自己，也写给看见的人。</p>
        <span class="home-card-arrow">读一读 →</span>
      </a>
      <a class="home-card fade-in" href="about.html" style="transition-delay:.2s">
        <span class="home-card-num">03</span>
        <h2 class="home-card-title">关于我</h2>
        <p class="home-card-desc">一个普通人，喜欢记录，喜欢安静，喜欢好天气。</p>
        <span class="home-card-arrow">认识一下 →</span>
      </a>
    </div>

  </div>

  <!-- 页脚 -->
  <footer>
    <span class="footer-copy">© 2025 我的小站 · 保留所有记忆</span>
    <div class="footer-links">
      <a href="gallery.html">相册</a>
      <a href="writings.html">随笔</a>
      <a href="about.html">关于</a>
    </div>
  </footer>

  <script>
    // 滚动淡入
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.12 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  <!-- 管理员入口（点击右下角隐藏链接进入登录页） -->
<a href="admin.html" style="position:fixed;bottom:12px;right:12px;width:10px;height:10px;opacity:0;z-index:50" title="管理员"></a>
<script src="editor.js"></script>

  </script>
</body>
</html>
